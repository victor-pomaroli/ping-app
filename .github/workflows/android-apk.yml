name: Build Android APK

on:
  push:
    branches:
      - fix/android-apk-ci
  workflow_dispatch:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'app.json'
      - 'eas.json'
      - 'src/**'
      - 'app/**'
      - 'index.ts'
      - '.github/workflows/android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies from lockfile
        # Se o lockfile ainda não tem uma dependência nova do package.json, o npm resolve e instala
        # em vez de falhar. Depois rode `npm install` localmente e commite o package-lock.json.
        run: npm ci || npm install --no-audit --no-fund
      - name: Generate Android project with Expo
        run: npx expo prebuild --platform android --non-interactive --clean
      - name: Disable R8 shrinking for WorkManager startup diagnosis
        working-directory: android
        run: |
          # The current APK crashes before React Native starts while Room/WorkManager
          # tries to instantiate WorkDatabase.canonicalName. Test without R8 shrinking.
          # gradle.properties generated by prebuild has no trailing newline; without the
          # leading '\n' the first appended line would be glued onto the last property
          # (expo.inlineModules.watchedDirectories=[]), breaking :expo:generateInlineModules.
          printf '\n%s\n' 'android.enableProguardInReleaseBuilds=false' 'android.enableMinifyInReleaseBuilds=false' >> gradle.properties
          grep -n 'expo.inlineModules.watchedDirectories' gradle.properties
          grep -nE 'minifyEnabled|enableProguardInReleaseBuilds|enableMinifyInReleaseBuilds' app/build.gradle gradle.properties
      - name: Build arm64 release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --stacktrace
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ping-android-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
